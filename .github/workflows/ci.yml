name: CI

on: [push, pull_request]

jobs:
  native:
    name: native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Configure
        run: cmake --preset native
      - name: Build
        run: cmake --build build/native
      # The library + quickstart example are built here. The example is not run:
      # it needs a real SE05x over I2C, which CI has no access to.
